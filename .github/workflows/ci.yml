# @author Admilson B. F. Cossa
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  ci:
    uses: go-gen-ecosystem/.github/.github/workflows/reusable-go-ci.yml@main
    with:
      coverage-threshold: 70

  # Dialect conformance against real databases: lifecycle, transactional vs
  # dirty failure semantics, dialect-specific SQL, and concurrent runs that
  # must apply each migration exactly once (proves the advisory locks).
  integration:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      statement-coverage: ${{ steps.coverage.outputs.percent }}
    env:
      GOWORK: "off"
      GOMIGRATE_TEST_POSTGRES_DSN: postgres://postgres:pw@localhost:5432/postgres?sslmode=disable
      GOMIGRATE_TEST_MYSQL_DSN: root:pw@tcp(localhost:3306)/
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: pw
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 2s --health-timeout 5s --health-retries 30
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: pw
        ports: ["3306:3306"]
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -ppw" --health-interval 2s --health-timeout 5s --health-retries 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Conformance (PostgreSQL, MySQL, SQLite) with race detector
        run: go test ./... -race -count=1 -coverpkg=./... -coverprofile=coverage.out
      - name: Coverage
        id: coverage
        run: |
          set -o pipefail
          percent=$(go tool cover -func=coverage.out | awk '$1 == "total:" && $2 == "(statements)" {print $3}')
          [[ "$percent" =~ ^([0-9]{1,2}\.[0-9]|100\.0)%$ ]]
          printf 'Total statement coverage: %s\n' "$percent"
          printf 'percent=%s\n' "$percent" >> "$GITHUB_OUTPUT"

  publish-coverage:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: integration
    runs-on: ubuntu-latest
    permissions:
      checks: write
    steps:
      - name: Publish statement coverage
        env:
          GH_TOKEN: ${{ github.token }}
          COVERAGE: ${{ needs.integration.outputs.statement-coverage }}
        run: |
          gh api --method POST "repos/$GITHUB_REPOSITORY/check-runs" \
            -f name=statement-coverage -f "head_sha=$GITHUB_SHA" -f conclusion=success \
            -f "details_url=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            -f "output[title]=$COVERAGE" \
            -f "output[summary]=Statement coverage measured by the PostgreSQL, MySQL, and SQLite integration suite." \
            --silent

  sqlserver-conformance:
    # Enable only after the repository owner accepts Microsoft's license
    # terms for the Developer Edition CI service.
    if: vars.GOMIGRATE_CI_SQLSERVER_ACCEPT_EULA == 'Y'
    runs-on: ubuntu-latest
    env:
      GOWORK: "off"
      GOMIGRATE_TEST_SQLSERVER_DSN: sqlserver://sa:Gomigrate-Only-Test-2022%21@localhost:1433?database=master&trustservercertificate=true
      GOMIGRATE_TEST_SQLSERVER_SELF_SIGNED: "1"
    services:
      sqlserver:
        image: mcr.microsoft.com/mssql/server:2022-CU28-ubuntu-22.04@sha256:4525e3efac9f3e241cb003bb2ff2a82818b502f37e12049d788b1a9fa7e13b7f
        env:
          ACCEPT_EULA: "Y"
          MSSQL_PID: Developer
          MSSQL_SA_PASSWORD: "Gomigrate-Only-Test-2022!"
        ports: ["1433:1433"]
        options: >-
          --health-cmd 'SQLCMDPASSWORD="$MSSQL_SA_PASSWORD" /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -C -Q "SELECT 1" -b'
          --health-interval 5s --health-timeout 5s --health-retries 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: SQL Server 2022 conformance with race detector
        run: go test . -race -count=1 -v -run '^TestConformance$/^sqlserver$'
