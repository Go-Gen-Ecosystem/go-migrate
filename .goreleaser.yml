# GoReleaser configuration for go-migrate.
# SQLite support uses modernc.org/sqlite (pure Go), so builds are CGO-free and
# cross-compile to every platform below from a single runner.
#
# @author Admilson B. F. Cossa

version: 2
project_name: go-migrate

before:
  hooks:
    - go mod tidy -diff
    - go mod verify
    - go test ./...

builds:
  - id: gomigrate
    main: ./cmd/gomigrate
    binary: gomigrate
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
      - -buildvcs=true
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]
    ldflags:
      - -s -w -X main.version={{.Version}}

archives:
  - formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"

checksum:
  name_template: checksums.txt

changelog:
  use: git
  sort: asc
