# GoReleaser configuration for go-migrate (CLI module).
# See: https://goreleaser.com
#
# NOTE ON CGO: go-migrate's SQLite support currently uses github.com/mattn/go-sqlite3,
# which requires CGO. This config therefore builds the linux/amd64 binary natively
# on the release runner. Full cross-platform binaries (darwin/windows, arm64) are a
# publish-time enhancement: either add a per-OS release matrix with CGO cross
# toolchains, or migrate the SQLite driver to a pure-Go implementation (modernc)
# so CGO can be disabled and goreleaser can cross-compile freely.
#
# @author Admilson B. F. Cossa

version: 2

before:
  hooks:
    - go mod tidy
    - go mod verify
    - go test ./...

builds:
  - id: gomigrate
    main: ./cmd/gomigrate
    binary: gomigrate
    env:
      - CGO_ENABLED=1
    goos:
      - linux
    goarch:
      - amd64
    ldflags:
      - -s -w -X main.version={{.Version}}

archives:
  - formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"

changelog:
  use: github
  sort: asc
  abbrev: 0
  groups:
    - title: '🚀 Features'
      regexp: '^.*?feat(\([[:word:]]+\))??!?:.+$'
      order: 0
    - title: '🐛 Bug Fixes'
      regexp: '^.*?fix(\([[:word:]]+\))??!?:.+$'
      order: 1
    - title: '📝 Documentation'
      regexp: '^.*?docs(\([[:word:]]+\))??!?:.+$'
      order: 2
    - title: '🔧 Maintenance'
      regexp: '^.*?(chore|refactor|style)(\([[:word:]]+\))??!?:.+$'
      order: 3
    - title: Other Changes
      order: 999
  filters:
    exclude:
      - '^test:'
      - '^ci:'
      - Merge pull request
      - Merge branch

release:
  github:
    owner: go-gen-ecosystem
    name: go-migrate
  name_template: "v{{.Version}}"
  draft: false
  prerelease: auto
  mode: append
  header: |
    ## go-migrate {{.Tag}}

    **Release Date:** {{.Date}}

    ### Install

    ```bash
    # CLI
    go install github.com/go-gen-ecosystem/go-migrate/cmd/gomigrate@{{.Tag}}
    # Library
    go get github.com/go-gen-ecosystem/go-migrate@{{.Tag}}
    ```
  footer: |
    **Full changelog:** https://github.com/go-gen-ecosystem/go-migrate/compare/{{.PreviousTag}}...{{.Tag}}

checksum:
  name_template: 'checksums.txt'
  algorithm: sha256

snapshot:
  version_template: "{{ incpatch .Version }}-next"
