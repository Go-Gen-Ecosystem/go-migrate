# Databases for the dialect conformance suite (`make test-integration`).
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_PASSWORD: pw
    ports: ["55432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 2s
      retries: 30

  mysql:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: pw
    ports: ["53306:3306"]
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-ppw"]
      interval: 2s
      retries: 60
