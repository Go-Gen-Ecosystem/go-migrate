# gomigrate GitHub Action: lint, gate and apply database migrations.
#
#   - uses: go-gen-ecosystem/go-migrate@v1
#     with:
#       command: lint            # PR annotations for risky SQL
#       driver: postgres
#
#   - uses: go-gen-ecosystem/go-migrate@v1
#     with:
#       command: up
#       dsn: ${{ secrets.DATABASE_URL }}
#
# @author Admilson B. F. Cossa
name: gomigrate
description: Lint, validate, plan and apply versioned SQL migrations (PostgreSQL, MySQL, SQLite) with go-migrate
author: Admilson B. F. Cossa
branding:
  icon: database
  color: blue

inputs:
  command:
    description: >-
      gomigrate command and flags, e.g. lint, status --fail-on-pending, or down --sql --to-tag "Before release".
      Use single or double quotes or backslash escapes to group arguments. Shell expansions are not performed.
    required: false
    default: lint
  dsn:
    description: Database DSN or URL (pass a secret). Not needed for lint.
    required: false
    default: ""
  driver:
    description: postgres | mysql | sqlite (inferred from the DSN when omitted; required for lint without a DSN)
    required: false
    default: ""
  dir:
    description: Migrations directory (default from gomigrate.yaml, else ./migrations)
    required: false
    default: ""
  version:
    description: gomigrate version to install (default the ref this action was used at, e.g. v1.0.0)
    required: false
    default: ""

outputs:
  exit-code:
    description: "0 ok, 1 error, 2 pending migrations (status --fail-on-pending), 3 lint findings (lint --fail-on)"
    value: ${{ steps.run.outputs.exit-code }}

runs:
  using: composite
  steps:
    - uses: actions/setup-go@v5
      with:
        go-version: stable
        cache: false
    - name: Install gomigrate
      shell: bash
      run: go install "github.com/go-gen-ecosystem/go-migrate/cmd/gomigrate@${INPUT_VERSION:-${ACTION_REF:-latest}}"
      env:
        INPUT_VERSION: ${{ inputs.version }}
        ACTION_REF: ${{ github.action_ref }}
    - name: Run gomigrate
      id: run
      shell: bash
      env:
        GOMIGRATE_DSN: ${{ inputs.dsn }}
        GOMIGRATE_DRIVER: ${{ inputs.driver }}
        INPUT_COMMAND: ${{ inputs.command }}
        INPUT_DIR: ${{ inputs.dir }}
        ACTION_PATH: ${{ github.action_path }}
      run: |
        code=1
        if args_file=$(mktemp "${TMPDIR:-/tmp}/gomigrate-action.XXXXXXXX"); then
          trap 'rm -f -- "$args_file"' EXIT
          if GO111MODULE=off GOWORK=off go run "$ACTION_PATH/internal/actionrunner/main.go" > "$args_file"; then
            args=()
            while IFS= read -r -d '' arg; do args+=("$arg"); done < "$args_file"
            flags=()
            if [ -n "$INPUT_DIR" ]; then flags+=(--dir "$INPUT_DIR"); fi
            # Lint findings become inline pull-request annotations.
            if [ "${args[0]:-}" = lint ]; then flags+=(-o github); fi
            code=0
            gomigrate "${flags[@]}" "${args[@]}" || code=$?
          fi
        fi
        printf 'exit-code=%s\n' "$code" >> "$GITHUB_OUTPUT"
        exit "$code"
