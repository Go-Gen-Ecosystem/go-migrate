/**
 * @file grpc_coordinator.proto
 * @description Definições gRPC para coordenação distribuída de cache
 * @author Admilson B. F. Cossa
 * @date 2024-12-19
 * @path pkg/core/database/migrations/internal/components/cache/grpc_coordinator.proto
 */

syntax = "proto3";

package cache;

option go_package = "github.com/lab/go-gen/pkg/core/database/migrations/internal/components/cache";

import "google/protobuf/timestamp.proto";
import "google/protobuf/empty.proto";

// Serviço principal de coordenação
service CacheCoordinator {
  // Descoberta de nós
  rpc DiscoverNodes(DiscoverNodesRequest) returns (DiscoverNodesResponse);
  
  // Registro de nós
  rpc RegisterNode(RegisterNodeRequest) returns (RegisterNodeResponse);
  rpc UnregisterNode(UnregisterNodeRequest) returns (UnregisterNodeResponse);
  rpc UpdateNodeStatus(UpdateNodeStatusRequest) returns (UpdateNodeStatusResponse);
  
  // Sincronização de operações
  rpc BroadcastOperation(BroadcastOperationRequest) returns (BroadcastOperationResponse);
  rpc SendToNode(SendToNodeRequest) returns (SendToNodeResponse);
  rpc ReceiveOperations(ReceiveOperationsRequest) returns (stream SyncOperationMessage);
  
  // Heartbeat e saúde
  rpc SendHeartbeat(HeartbeatRequest) returns (HeartbeatResponse);
  rpc GetNodeHealth(GetNodeHealthRequest) returns (GetNodeHealthResponse);
  
  // Gerenciamento de partições
  rpc GetPartitionInfo(GetPartitionInfoRequest) returns (GetPartitionInfoResponse);
  rpc RebalancePartitions(RebalancePartitionsRequest) returns (RebalancePartitionsResponse);
}

// Mensagens de descoberta de nós
message DiscoverNodesRequest {
  string cluster_name = 1;
  string requesting_node_id = 2;
}

message DiscoverNodesResponse {
  repeated NodeInfoMessage nodes = 1;
  bool success = 2;
  string error_message = 3;
}

// Mensagens de registro de nós
message RegisterNodeRequest {
  NodeInfoMessage node = 1;
}

message RegisterNodeResponse {
  bool success = 1;
  string error_message = 2;
}

message UnregisterNodeRequest {
  string node_id = 1;
}

message UnregisterNodeResponse {
  bool success = 1;
  string error_message = 2;
}

message UpdateNodeStatusRequest {
  string node_id = 1;
  NodeStatus status = 2;
}

message UpdateNodeStatusResponse {
  bool success = 1;
  string error_message = 2;
}

// Mensagens de sincronização
message BroadcastOperationRequest {
  SyncOperationMessage operation = 1;
}

message BroadcastOperationResponse {
  bool success = 1;
  string error_message = 2;
  int32 nodes_reached = 3;
}

message SendToNodeRequest {
  string target_node_id = 1;
  SyncOperationMessage operation = 2;
}

message SendToNodeResponse {
  bool success = 1;
  string error_message = 2;
}

message ReceiveOperationsRequest {
  string node_id = 1;
  string cluster_name = 2;
}

// Mensagens de heartbeat
message HeartbeatRequest {
  NodeInfoMessage node = 1;
}

message HeartbeatResponse {
  bool success = 1;
  string error_message = 2;
  repeated NodeInfoMessage active_nodes = 3;
}

message GetNodeHealthRequest {
  string node_id = 1;
}

message GetNodeHealthResponse {
  NodeHealthMessage health = 1;
  bool success = 2;
  string error_message = 3;
}

// Mensagens de particionamento
message GetPartitionInfoRequest {
  string node_id = 1;
}

message GetPartitionInfoResponse {
  repeated PartitionInfoMessage partitions = 1;
  bool success = 2;
  string error_message = 3;
}

message RebalancePartitionsRequest {
  string cluster_name = 1;
  string requesting_node_id = 2;
  repeated string target_nodes = 3;
}

message RebalancePartitionsResponse {
  bool success = 1;
  string error_message = 2;
  repeated PartitionInfoMessage new_partitions = 3;
}

// Estruturas de dados
message NodeInfoMessage {
  string id = 1;
  NodeStatus status = 2;
  google.protobuf.Timestamp last_seen = 3;
  string version = 4;
  map<string, string> metadata = 5;
  string address = 6;
  int32 port = 7;
}

message SyncOperationMessage {
  string id = 1;
  SyncOperationType type = 2;
  string node_id = 3;
  google.protobuf.Timestamp timestamp = 4;
  string cache_name = 5;
  string key = 6;
  bytes value = 7;
  google.protobuf.Timestamp ttl = 8;
  map<string, string> metadata = 9;
  int64 version = 10;
}

message NodeHealthMessage {
  string node_id = 1;
  NodeStatus status = 2;
  google.protobuf.Timestamp last_heartbeat = 3;
  bool is_reachable = 4;
  string version = 5;
  int64 response_time_ms = 6;
  map<string, string> metrics = 7;
}

message PartitionInfoMessage {
  string id = 1;
  string node_id = 2;
  repeated string key_ranges = 3;
  int32 replica_count = 4;
  repeated string replica_nodes = 5;
  PartitionStatus status = 6;
}

// Enums
enum NodeStatus {
  NODE_STATUS_UNKNOWN = 0;
  NODE_STATUS_ACTIVE = 1;
  NODE_STATUS_INACTIVE = 2;
  NODE_STATUS_JOINING = 3;
  NODE_STATUS_LEAVING = 4;
  NODE_STATUS_FAILED = 5;
}

enum SyncOperationType {
  SYNC_OPERATION_UNKNOWN = 0;
  SYNC_OPERATION_SET = 1;
  SYNC_OPERATION_DELETE = 2;
  SYNC_OPERATION_CLEAR = 3;
  SYNC_OPERATION_EXPIRE = 4;
  SYNC_OPERATION_INVALIDATE = 5;
  SYNC_OPERATION_BATCH = 6;
}

enum PartitionStatus {
  PARTITION_STATUS_UNKNOWN = 0;
  PARTITION_STATUS_ACTIVE = 1;
  PARTITION_STATUS_MIGRATING = 2;
  PARTITION_STATUS_REBALANCING = 3;
  PARTITION_STATUS_FAILED = 4;
}