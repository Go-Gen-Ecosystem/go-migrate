# Example Changeset Migration: Comments System
# @file changeset_comments.yaml
# @description Creates comments table with moderation and threading support
# @author Admilson B. F. Cossa
# @date 2025-01-28
# @path pkg/core/database/migrations/examples/migrations/changeset_comments.yaml

databaseChangeLog:
  - changeSet:
      id: 1
      author: admilson.cossa
      comment: Create comments table with threading support
      preConditions:
        - onFail: MARK_RAN
        - not:
            tableExists:
              tableName: comments
        - tableExists:
            tableName: users
        - tableExists:
            tableName: posts
      changes:
        - createTable:
            tableName: comments
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: post_id
                  type: BIGINT
                  constraints:
                    nullable: false
              - column:
                  name: user_id
                  type: BIGINT
                  constraints:
                    nullable: false
              - column:
                  name: parent_id
                  type: BIGINT
                  constraints:
                    nullable: true
              - column:
                  name: content
                  type: TEXT
                  constraints:
                    nullable: false
              - column:
                  name: status
                  type: VARCHAR(20)
                  defaultValue: pending
                  constraints:
                    nullable: false
              - column:
                  name: like_count
                  type: BIGINT
                  defaultValue: 0
                  constraints:
                    nullable: false
              - column:
                  name: dislike_count
                  type: BIGINT
                  defaultValue: 0
                  constraints:
                    nullable: false
              - column:
                  name: reply_count
                  type: BIGINT
                  defaultValue: 0
                  constraints:
                    nullable: false
              - column:
                  name: depth
                  type: INT
                  defaultValue: 0
                  constraints:
                    nullable: false
              - column:
                  name: path
                  type: VARCHAR(500)
                  constraints:
                    nullable: true
              - column:
                  name: is_pinned
                  type: BOOLEAN
                  defaultValueBoolean: false
                  constraints:
                    nullable: false
              - column:
                  name: is_edited
                  type: BOOLEAN
                  defaultValueBoolean: false
                  constraints:
                    nullable: false
              - column:
                  name: edited_at
                  type: TIMESTAMP
                  constraints:
                    nullable: true
              - column:
                  name: moderated_by
                  type: BIGINT
                  constraints:
                    nullable: true
              - column:
                  name: moderated_at
                  type: TIMESTAMP
                  constraints:
                    nullable: true
              - column:
                  name: moderation_reason
                  type: VARCHAR(500)
                  constraints:
                    nullable: true
              - column:
                  name: ip_address
                  type: VARCHAR(45)
                  constraints:
                    nullable: true
              - column:
                  name: user_agent
                  type: VARCHAR(500)
                  constraints:
                    nullable: true
              - column:
                  name: created_at
                  type: TIMESTAMP
                  defaultValueComputed: CURRENT_TIMESTAMP
                  constraints:
                    nullable: false
              - column:
                  name: updated_at
                  type: TIMESTAMP
                  defaultValueComputed: CURRENT_TIMESTAMP
                  constraints:
                    nullable: false
              - column:
                  name: deleted_at
                  type: TIMESTAMP
                  constraints:
                    nullable: true
        
        # Foreign key constraints
        - addForeignKeyConstraint:
            baseTableName: comments
            baseColumnNames: post_id
            constraintName: fk_comments_post
            referencedTableName: posts
            referencedColumnNames: id
            onDelete: CASCADE
        
        - addForeignKeyConstraint:
            baseTableName: comments
            baseColumnNames: user_id
            constraintName: fk_comments_user
            referencedTableName: users
            referencedColumnNames: id
            onDelete: CASCADE
        
        - addForeignKeyConstraint:
            baseTableName: comments
            baseColumnNames: parent_id
            constraintName: fk_comments_parent
            referencedTableName: comments
            referencedColumnNames: id
            onDelete: CASCADE
        
        - addForeignKeyConstraint:
            baseTableName: comments
            baseColumnNames: moderated_by
            constraintName: fk_comments_moderator
            referencedTableName: users
            referencedColumnNames: id
            onDelete: SET NULL
        
        # Indexes for performance
        - createIndex:
            tableName: comments
            indexName: idx_comments_post
            columns:
              - column:
                  name: post_id
        
        - createIndex:
            tableName: comments
            indexName: idx_comments_user
            columns:
              - column:
                  name: user_id
        
        - createIndex:
            tableName: comments
            indexName: idx_comments_parent
            columns:
              - column:
                  name: parent_id
        
        - createIndex:
            tableName: comments
            indexName: idx_comments_status
            columns:
              - column:
                  name: status
        
        - createIndex:
            tableName: comments
            indexName: idx_comments_created
            columns:
              - column:
                  name: created_at
        
        - createIndex:
            tableName: comments
            indexName: idx_comments_path
            columns:
              - column:
                  name: path
        
        # Composite indexes
        - createIndex:
            tableName: comments
            indexName: idx_comments_post_status
            columns:
              - column:
                  name: post_id
              - column:
                  name: status
        
        - createIndex:
            tableName: comments
            indexName: idx_comments_post_created
            columns:
              - column:
                  name: post_id
              - column:
                  name: created_at
        
        - createIndex:
            tableName: comments
            indexName: idx_comments_user_status
            columns:
              - column:
                  name: user_id
              - column:
                  name: status
      
      rollback:
        - dropTable:
            tableName: comments

  - changeSet:
      id: 2
      author: admilson.cossa
      comment: Add check constraints for comments validation
      changes:
        # Comment status constraint
        - sql:
            sql: >
              ALTER TABLE comments ADD CONSTRAINT chk_comments_status 
              CHECK (status IN ('pending', 'approved', 'rejected', 'spam', 'deleted'))
        
        # Like count constraint
        - sql:
            sql: >
              ALTER TABLE comments ADD CONSTRAINT chk_comments_like_count 
              CHECK (like_count >= 0)
        
        # Dislike count constraint
        - sql:
            sql: >
              ALTER TABLE comments ADD CONSTRAINT chk_comments_dislike_count 
              CHECK (dislike_count >= 0)
        
        # Reply count constraint
        - sql:
            sql: >
              ALTER TABLE comments ADD CONSTRAINT chk_comments_reply_count 
              CHECK (reply_count >= 0)
        
        # Depth constraint (max 10 levels)
        - sql:
            sql: >
              ALTER TABLE comments ADD CONSTRAINT chk_comments_depth 
              CHECK (depth >= 0 AND depth <= 10)
        
        # Content length constraint
        - sql:
            sql: >
              ALTER TABLE comments ADD CONSTRAINT chk_comments_content_length 
              CHECK (LENGTH(content) >= 1 AND LENGTH(content) <= 10000)
      
      rollback:
        - sql:
            sql: ALTER TABLE comments DROP CONSTRAINT chk_comments_status
        - sql:
            sql: ALTER TABLE comments DROP CONSTRAINT chk_comments_like_count
        - sql:
            sql: ALTER TABLE comments DROP CONSTRAINT chk_comments_dislike_count
        - sql:
            sql: ALTER TABLE comments DROP CONSTRAINT chk_comments_reply_count
        - sql:
            sql: ALTER TABLE comments DROP CONSTRAINT chk_comments_depth
        - sql:
            sql: ALTER TABLE comments DROP CONSTRAINT chk_comments_content_length

  - changeSet:
      id: 3
      author: admilson.cossa
      comment: Create comment_likes table for tracking user likes/dislikes
      preConditions:
        - onFail: MARK_RAN
        - not:
            tableExists:
              tableName: comment_likes
        - tableExists:
            tableName: comments
        - tableExists:
            tableName: users
      changes:
        - createTable:
            tableName: comment_likes
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: comment_id
                  type: BIGINT
                  constraints:
                    nullable: false
              - column:
                  name: user_id
                  type: BIGINT
                  constraints:
                    nullable: false
              - column:
                  name: type
                  type: VARCHAR(10)
                  constraints:
                    nullable: false
              - column:
                  name: created_at
                  type: TIMESTAMP
                  defaultValueComputed: CURRENT_TIMESTAMP
                  constraints:
                    nullable: false
        
        # Foreign key constraints
        - addForeignKeyConstraint:
            baseTableName: comment_likes
            baseColumnNames: comment_id
            constraintName: fk_comment_likes_comment
            referencedTableName: comments
            referencedColumnNames: id
            onDelete: CASCADE
        
        - addForeignKeyConstraint:
            baseTableName: comment_likes
            baseColumnNames: user_id
            constraintName: fk_comment_likes_user
            referencedTableName: users
            referencedColumnNames: id
            onDelete: CASCADE
        
        # Unique constraint to prevent duplicate likes
        - addUniqueConstraint:
            tableName: comment_likes
            columnNames: comment_id, user_id
            constraintName: uk_comment_likes_user_comment
        
        # Indexes
        - createIndex:
            tableName: comment_likes
            indexName: idx_comment_likes_comment
            columns:
              - column:
                  name: comment_id
        
        - createIndex:
            tableName: comment_likes
            indexName: idx_comment_likes_user
            columns:
              - column:
                  name: user_id
        
        - createIndex:
            tableName: comment_likes
            indexName: idx_comment_likes_type
            columns:
              - column:
                  name: type
        
        # Check constraint for like type
        - sql:
            sql: >
              ALTER TABLE comment_likes ADD CONSTRAINT chk_comment_likes_type 
              CHECK (type IN ('like', 'dislike'))
      
      rollback:
        - dropTable:
            tableName: comment_likes

  - changeSet:
      id: 4
      author: admilson.cossa
      comment: Create triggers for updating comment counts
      dbms: mysql
      changes:
        # Trigger to update like_count when comment_likes is inserted
        - sql:
            sql: |
              CREATE TRIGGER tr_comment_likes_insert 
              AFTER INSERT ON comment_likes
              FOR EACH ROW
              BEGIN
                IF NEW.type = 'like' THEN
                  UPDATE comments 
                  SET like_count = like_count + 1 
                  WHERE id = NEW.comment_id;
                ELSEIF NEW.type = 'dislike' THEN
                  UPDATE comments 
                  SET dislike_count = dislike_count + 1 
                  WHERE id = NEW.comment_id;
                END IF;
              END
        
        # Trigger to update like_count when comment_likes is deleted
        - sql:
            sql: |
              CREATE TRIGGER tr_comment_likes_delete 
              AFTER DELETE ON comment_likes
              FOR EACH ROW
              BEGIN
                IF OLD.type = 'like' THEN
                  UPDATE comments 
                  SET like_count = like_count - 1 
                  WHERE id = OLD.comment_id;
                ELSEIF OLD.type = 'dislike' THEN
                  UPDATE comments 
                  SET dislike_count = dislike_count - 1 
                  WHERE id = OLD.comment_id;
                END IF;
              END
        
        # Trigger to update reply_count when comments is inserted
        - sql:
            sql: |
              CREATE TRIGGER tr_comments_insert 
              AFTER INSERT ON comments
              FOR EACH ROW
              BEGIN
                IF NEW.parent_id IS NOT NULL THEN
                  UPDATE comments 
                  SET reply_count = reply_count + 1 
                  WHERE id = NEW.parent_id;
                END IF;
              END
        
        # Trigger to update reply_count when comments is deleted
        - sql:
            sql: |
              CREATE TRIGGER tr_comments_delete 
              AFTER DELETE ON comments
              FOR EACH ROW
              BEGIN
                IF OLD.parent_id IS NOT NULL THEN
                  UPDATE comments 
                  SET reply_count = reply_count - 1 
                  WHERE id = OLD.parent_id;
                END IF;
              END
      
      rollback:
        - sql:
            sql: DROP TRIGGER IF EXISTS tr_comment_likes_insert
        - sql:
            sql: DROP TRIGGER IF EXISTS tr_comment_likes_delete
        - sql:
            sql: DROP TRIGGER IF EXISTS tr_comments_insert
        - sql:
            sql: DROP TRIGGER IF EXISTS tr_comments_delete

  - changeSet:
      id: 5
      author: admilson.cossa
      comment: Create full-text search index for comments
      dbms: mysql
      changes:
        - sql:
            sql: ALTER TABLE comments ADD FULLTEXT(content)
      
      rollback:
        - sql:
            sql: ALTER TABLE comments DROP INDEX content